<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学数字平台 - 学生管理</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
</head>
<body>
<div id="app">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">教学数字平台</div>
            <nav class="sidebar-menu">
                <a v-for="m in menus" :key="m.key" :href="m.href"
                   :class="['menu-item', { active: m.key === 'student' }]">
                    <span class="menu-icon" v-html="m.icon"></span>
                    <span class="menu-label">{{ m.label }}</span>
                </a>
            </nav>
        </aside>

        <div class="main-area">
            <header class="header">
                <span class="header-left">学生管理</span>
                <div class="header-right">
                    <span class="header-user">{{ username }}</span>
                    <span class="header-logout" @click="handleLogout">退出登录</span>
                </div>
            </header>

            <main class="content">
                <div class="page-container">
                    <!-- 搜索栏 -->
                    <div class="search-bar">
                        <el-input v-model="searchName" placeholder="学生姓名" clearable
                                  @keyup.enter="handleSearch" @clear="handleSearch"></el-input>
                        <el-select v-model="searchClassId" placeholder="全部班级" clearable
                                   @change="handleSearch" @clear="handleSearch">
                            <el-option v-for="c in classList" :key="c.id"
                                       :label="c.className" :value="c.id"></el-option>
                        </el-select>
                        <el-button type="primary" @click="handleSearch">搜索</el-button>
                        <span class="spacer"></span>
                        <el-button type="primary" @click="openAdd">新增学生</el-button>
                    </div>

                    <!-- 表格 -->
                    <el-table :data="tableData" border stripe v-loading="loading" style="width:100%">
                        <el-table-column prop="name" label="姓名" width="100"></el-table-column>
                        <el-table-column prop="studentNo" label="学号" width="140"></el-table-column>
                        <el-table-column prop="genderText" label="性别" width="70"></el-table-column>
                        <el-table-column prop="className" label="班级" min-width="130"></el-table-column>
                        <el-table-column prop="phone" label="联系电话" width="130"></el-table-column>
                        <el-table-column prop="enrollmentDate" label="入学日期" width="120"></el-table-column>
                        <el-table-column label="操作" width="150" fixed="right">
                            <template #default="scope">
                                <el-button size="small" type="primary" link @click="openEdit(scope.row)">编辑</el-button>
                                <el-button size="small" type="danger" link @click="handleDelete(scope.row)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>

                    <!-- 分页 -->
                    <el-pagination
                        style="margin-top:16px;justify-content:flex-end"
                        v-model:current-page="page" v-model:page-size="pageSize"
                        :page-sizes="[10, 20, 50]" :total="total"
                        layout="total, sizes, prev, pager, next, jumper"
                        @size-change="loadData" @current-change="loadData"
                        background></el-pagination>
                </div>
            </main>
        </div>
    </div>

    <!-- 新增/编辑对话框 -->
    <el-dialog v-model="dialogVisible" :title="isEdit ? '编辑学生' : '新增学生'"
               width="520px" :close-on-click-modal="false" @close="resetForm">
        <el-form ref="formRef" :model="form" :rules="rules" label-width="80px">
            <el-form-item label="姓名" prop="name">
                <el-input v-model="form.name" placeholder="请输入姓名" maxlength="20"></el-input>
            </el-form-item>
            <el-form-item label="学号" prop="studentNo">
                <el-input v-model="form.studentNo" placeholder="请输入学号" maxlength="30"></el-input>
            </el-form-item>
            <el-form-item label="性别" prop="gender">
                <el-radio-group v-model="form.gender">
                    <el-radio :value="1">男</el-radio>
                    <el-radio :value="2">女</el-radio>
                </el-radio-group>
            </el-form-item>
            <el-form-item label="联系电话" prop="phone">
                <el-input v-model="form.phone" placeholder="请输入手机号" maxlength="11"></el-input>
            </el-form-item>
            <el-form-item label="所属班级" prop="classId">
                <el-select v-model="form.classId" placeholder="请选择班级" style="width:100%">
                    <el-option v-for="c in classList" :key="c.id"
                               :label="c.className" :value="c.id"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="入学日期" prop="enrollmentDate">
                <el-date-picker v-model="form.enrollmentDate" type="date"
                                placeholder="请选择入学日期" value-format="YYYY-MM-DD"
                                style="width:100%"></el-date-picker>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" :loading="submitLoading" @click="handleSubmit">确定</el-button>
        </template>
    </el-dialog>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="js/app.js"></script>

<script>
(function() {
    if (!checkLogin()) { window.location.href = 'login.html'; }

    var menus = [
        { key:'dashboard',  label:'仪表盘',   href:'index.html',      icon:'&#x2302;' },
        { key:'student',    label:'学生管理', href:'student.html',    icon:'&#x263A;' },
        { key:'class',      label:'班级管理', href:'class.html',      icon:'&#x2603;' },
        { key:'schedule',   label:'课程排课', href:'schedule.html',   icon:'&#x2617;' },
        { key:'attendance', label:'考勤打卡', href:'attendance.html', icon:'&#x261B;' },
        { key:'score',      label:'成绩管理', href:'score.html',      icon:'&#x2606;' },
        { key:'homework',   label:'作业管理', href:'homework.html',   icon:'&#x270E;' }
    ];

    var app = Vue.createApp({
        data: function() {
            return {
                menus: menus, username: '',
                searchName: '', searchClassId: null,
                tableData: [], page: 1, pageSize: 10, total: 0, loading: false,
                classList: [],
                dialogVisible: false, isEdit: false, editId: null,
                submitLoading: false,
                form: { name: '', studentNo: '', gender: 1, phone: '', classId: null, enrollmentDate: '' },
                rules: {
                    name:           [{ required: true, message: '请输入学生姓名', trigger: 'blur' }],
                    studentNo:      [{ required: true, message: '请输入学号', trigger: 'blur' }],
                    gender:         [{ required: true, message: '请选择性别', trigger: 'change' }],
                    classId:        [{ required: true, message: '请选择班级', trigger: 'change' }],
                    enrollmentDate: [{ required: true, message: '请选择入学日期', trigger: 'change' }],
                    phone: [
                        { pattern: /^1\d{10}$/, message: '请输入正确的11位手机号', trigger: 'blur' }
                    ]
                }
            };
        },
        methods: {
            handleLogout: function() { API.logout().then(function() { logout(); }); },
            handleSearch: function() { this.page = 1; this.loadData(); },
            loadData: function() {
                var self = this;
                self.loading = true;
                API.student.list({
                    page: self.page, pageSize: self.pageSize,
                    name: self.searchName || undefined,
                    classId: self.searchClassId || undefined
                }).then(function(res) {
                    self.loading = false;
                    if (res.code === 200) {
                        self.tableData = res.data.list;
                        self.total = res.data.total;
                    }
                });
            },
            loadClasses: function() {
                var self = this;
                API.class.all().then(function(res) {
                    if (res.code === 200) self.classList = res.data;
                });
            },
            openAdd: function() {
                this.isEdit = false; this.editId = null; this.resetForm(); this.dialogVisible = true;
            },
            openEdit: function(row) {
                this.isEdit = true; this.editId = row.id;
                this.form = {
                    name: row.name, studentNo: row.studentNo, gender: row.gender,
                    phone: row.phone || '', classId: row.classId, enrollmentDate: row.enrollmentDate
                };
                this.dialogVisible = true;
            },
            handleSubmit: function() {
                var self = this;
                self.$refs.formRef.validate(function(valid) {
                    if (!valid) return;
                    self.submitLoading = true;
                    var fn = self.isEdit
                        ? API.student.update(self.editId, self.form)
                        : API.student.create(self.form);
                    fn.then(function(res) {
                        self.submitLoading = false;
                        if (res.code === 200) {
                            ElMessage.success(self.isEdit ? '修改成功' : '新增成功');
                            self.dialogVisible = false;
                            self.loadData();
                        } else {
                            ElMessage.error(res.message);
                        }
                    });
                });
            },
            handleDelete: function(row) {
                var self = this;
                ElMessageBox.confirm('确认删除学生"' + row.name + '"？', '提示', {
                    confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
                }).then(function() {
                    API.student.delete(row.id).then(function(res) {
                        if (res.code === 200) {
                            ElMessage.success('删除成功');
                            self.loadData();
                        } else {
                            ElMessage.error(res.message);
                        }
                    });
                }).catch(function() {});
            },
            resetForm: function() {
                var self = this;
                self.$nextTick(function() {
                    self.$refs.formRef && self.$refs.formRef.resetFields();
                });
                this.form = { name: '', studentNo: '', gender: 1, phone: '', classId: null, enrollmentDate: '' };
            }
        },
        mounted: function() {
            var user = getCurrentUser();
            this.username = user ? user.realName : '管理员';
            this.loadData();
            this.loadClasses();
        }
    });

    app.use(ElementPlus);
    app.mount('#app');
})();
</script>
</body>
</html>
