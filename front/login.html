<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学数字平台 - 登录</title>
    <link rel="stylesheet" href="css/common.css">
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            width: 420px;
            background: #fff;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 8px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 14px;
            color: #909399;
            margin-bottom: 32px;
        }
        .login-btn {
            width: 100%;
        }
        .login-error {
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="login-page">
        <div class="login-card">
            <div class="login-title">教学数字平台</div>
            <div class="login-subtitle">管理系统</div>

            <el-form ref="formRef" :model="form" :rules="rules" label-position="top" @submit.prevent="handleLogin">
                <el-form-item label="用户名" prop="username">
                    <el-input v-model="form.username" placeholder="请输入用户名" size="large"
                              :prefix-icon="User" clearable></el-input>
                </el-form-item>

                <el-form-item label="密码" prop="password">
                    <el-input v-model="form.password" type="password" placeholder="请输入密码" size="large"
                              :prefix-icon="Lock" show-password @keyup.enter="handleLogin"></el-input>
                </el-form-item>

                <el-checkbox v-model="form.remember" style="margin-bottom:16px">记住密码</el-checkbox>

                <el-button type="primary" size="large" class="login-btn"
                           :loading="loading" @click="handleLogin">登 录</el-button>
            </el-form>

            <div class="login-error">
                <el-alert v-if="errorMsg" :title="errorMsg" type="error" show-icon :closable="false" />
            </div>
        </div>
    </div>
</div>

<!-- Vue 3 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Element Plus JS -->
<script src="https://unpkg.com/element-plus"></script>
<!-- Element Plus Icons -->
<script src="https://unpkg.com/@element-plus/icons-vue"></script>
<!-- App -->
<script src="js/app.js"></script>

<script>
const { createApp, ref, reactive, onMounted } = Vue;

const app = createApp({
    setup() {
        const formRef = ref(null);
        const loading = ref(false);
        const errorMsg = ref('');

        const form = reactive({
            username: '',
            password: '',
            remember: false
        });

        const rules = {
            username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
            password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
        };

        // 页面加载时检查是否记住了密码
        onMounted(function() {
            var saved = localStorage.getItem('edu_remember');
            if (saved) {
                try {
                    var s = JSON.parse(saved);
                    form.username = s.username || '';
                    form.password = s.password || '';
                    form.remember = true;
                } catch(e) {}
            }
            // 已登录则直接跳转
            if (checkLogin()) {
                window.location.href = 'index.html';
            }
        });

        function handleLogin() {
            formRef.value.validate(function(valid) {
                if (!valid) return;

                loading.value = true;
                errorMsg.value = '';

                API.login({ username: form.username, password: form.password }).then(function(res) {
                    loading.value = false;
                    if (res.code === 200) {
                        // 记住密码
                        if (form.remember) {
                            localStorage.setItem('edu_remember', JSON.stringify({
                                username: form.username,
                                password: form.password
                            }));
                        } else {
                            localStorage.removeItem('edu_remember');
                        }
                        window.location.href = 'index.html';
                    } else {
                        errorMsg.value = res.message;
                    }
                });
            });
        }

        // Element Plus Icons
        var icons = ElementPlusIconsVue || {};

        return {
            formRef, form, rules, loading, errorMsg, handleLogin,
            User: icons.User || null,
            Lock: icons.Lock || null
        };
    }
});

// 注册 Element Plus
app.use(ElementPlus);
// 注册图标
if (ElementPlusIconsVue) {
    for (var key in ElementPlusIconsVue) {
        app.component(key, ElementPlusIconsVue[key]);
    }
}

app.mount('#app');
</script>
</body>
</html>
