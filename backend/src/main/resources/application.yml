server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/edu?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    # 统一日期序列化格式
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# JWT 配置（登录令牌）
jwt:
  # 签名密钥（至少 32 字符，生产环境请更换）
  secret: edu-secret-key-2026-education-management-system
  # Token 有效期（毫秒），默认 24 小时
  expiration: 86400000

mybatis:
  # Mapper XML 文件路径
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径（自动注册别名）
  type-aliases-package: com.edu.entity
  configuration:
    # 下划线命名转驼峰命名
    map-underscore-to-camel-case: true
    # 控制台打印 SQL 日志（开发阶段开启）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
